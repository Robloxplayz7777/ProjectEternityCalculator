name: Release

# Publishes a GitHub Release with both apps. Triggers:
#  - add a new "## [x.y.z]" section at the top of CHANGELOG.md and push to main
#  - push a tag like v1.2.0
#  - Actions -> Release -> Run workflow
on:
  push:
    tags: ["v*"]
    branches: [main]
    paths: [CHANGELOG.md, .github/workflows/release.yml]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create the release for (e.g. v1.2.0)"
        required: true

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      skip: ${{ steps.v.outputs.skip }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then TAG="$INPUT_TAG"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then TAG="${GITHUB_REF_NAME}"
          else TAG="v$(grep -m1 -oP '^## \[\K[0-9][^\]]*' CHANGELOG.md)"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists - nothing to do."; echo "skip=true" >> "$GITHUB_OUTPUT"
          else echo "Will publish $TAG"; echo "skip=false" >> "$GITHUB_OUTPUT"; fi

  windows:
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: desktop/target/release/ForgingXpCalculator.exe

  android:
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;35.0.0" > /dev/null
      - name: Restore signing key (optional secret)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > mobile/android/forgingxp.keystore
            echo "Using the project signing key."
          else
            echo "::warning::ANDROID_KEYSTORE_B64 secret not set - APK is signed with a temporary key and won't install over an existing copy."
          fi
      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: bash mobile/android/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: mobile/android/ForgingXP.apk

  release:
    needs: [version, windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Release notes from CHANGELOG.md
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          V="${TAG#v}"
          awk -v hdr="## [$V]" 'index($0, "## [")==1 { p = (index($0, hdr)==1); next } p' CHANGELOG.md > section.md
          {
            echo "### Downloads"
            echo "- **Windows 10/11**: \`ForgingXpCalculator.exe\` (single file; uses the WebView2 runtime built into Windows)"
            echo "- **Android 7.0+**: \`ForgingXP.apk\` (sideload; allow *Install unknown apps*)"
            echo
            if [ -s section.md ]; then echo "## What's new"; cat section.md; else echo "See CHANGELOG.md for details."; fi
            echo
            echo "Full history: [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)"
          } > notes.md
          cat notes.md
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Forging XP Calculator ${{ needs.version.outputs.tag }}
          files: |
            dist/ForgingXpCalculator.exe
            dist/ForgingXP.apk
          body_path: notes.md
