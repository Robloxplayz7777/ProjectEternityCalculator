name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows desktop (.exe)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: Build
        run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: ForgingXpCalculator-windows
          path: desktop/target/release/ForgingXpCalculator.exe

  android:
    name: Android (.apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;35.0.0" > /dev/null
      - name: Build APK
        run: bash mobile/android/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ForgingXP-android
          path: mobile/android/ForgingXP.apk
